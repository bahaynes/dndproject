name: Cleanup Cloud Run & Artifact Registry

on:
  schedule:
    # Run daily at 04:00 UTC (20:00 PST / 21:00 PDT)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Minimum number of recent image versions to keep per package"
        required: false
        default: "10"
        type: string
      dry_run:
        description: "Log what would be deleted without actually deleting"
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dndproject-495514' }}
  REGION: us-central1
  REPO_NAME: dndproject-repo
  IMAGE_PREFIX: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || 'dndproject-495514' }}/dndproject-repo

jobs:
  cleanup-orphaned-pr-services:
    name: Cleanup Orphaned PR Cloud Run Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run Services for Closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          SERVICES=$(gcloud run services list \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(metadata.name)")

          PR_NUMBERS=$(echo "$SERVICES" \
            | grep -oE '^dnd-(frontend|backend)-pr-[0-9]+$' \
            | sed -E 's/^dnd-(frontend|backend)-pr-([0-9]+)$/\2/' \
            | sort -u || true)

          if [ -z "$PR_NUMBERS" ]; then
            echo "No PR Cloud Run services found."
            exit 0
          fi

          for PR_NUM in $PR_NUMBERS; do
            STATE=$(gh pr view "$PR_NUM" -R "${{ github.repository }}" --json state --jq .state 2>/dev/null || echo "NOT_FOUND")
            echo "PR #${PR_NUM}: state=${STATE}"
            if [ "$STATE" != "OPEN" ]; then
              for SVC in "dnd-frontend-pr-${PR_NUM}" "dnd-backend-pr-${PR_NUM}"; do
                if echo "$SERVICES" | grep -qx "$SVC"; then
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[dry-run] Would delete Cloud Run service ${SVC}"
                  else
                    echo "Deleting orphaned Cloud Run service ${SVC}..."
                    gcloud run services delete "$SVC" \
                      --region "${REGION}" \
                      --project "${PROJECT_ID}" \
                      --quiet || echo "Failed to delete ${SVC} (continuing)."
                  fi
                fi
              done
            fi
          done

  cleanup-artifact-registry:
    name: Prune Old Artifact Registry Images
    needs: cleanup-orphaned-pr-services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply Artifact Registry Cleanup Policy (best-effort)
        if: ${{ inputs.dry_run != true }}
        run: |
          cat << 'EOF' > /tmp/ar-cleanup-policy.json
          [
            {
              "name": "delete-untagged-after-7d",
              "action": {"type": "Delete"},
              "condition": {
                "tagState": "UNTAGGED",
                "olderThan": "604800s"
              }
            },
            {
              "name": "keep-recent-10-versions",
              "action": {"type": "Keep"},
              "mostRecentVersions": {
                "keepCount": 10
              }
            }
          ]
          EOF

          gcloud artifacts repositories set-cleanup-policies "${REPO_NAME}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --policy=/tmp/ar-cleanup-policy.json \
            --no-dry-run \
            || echo "::warning::Could not set repository cleanup policy (missing artifactregistry.repositories.update permission); falling back to explicit image pruning below."

      - name: Prune Old Container Images
        env:
          KEEP_COUNT: ${{ inputs.keep_count || '10' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # Collect all images currently referenced by live Cloud Run services so we never delete an active image
          LIVE_IMAGES=$(gcloud run services list \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(spec.template.spec.containers[0].image)" || true)
          echo "Live Cloud Run images:"
          echo "$LIVE_IMAGES"

          for PKG in dnd-backend dnd-frontend; do
            echo "=== Checking ${IMAGE_PREFIX}/${PKG} (keeping ${KEEP_COUNT} most recent + live images) ==="
            IMAGES_JSON=$(gcloud artifacts docker images list "${IMAGE_PREFIX}/${PKG}" \
              --include-tags \
              --sort-by="~UPDATE_TIME" \
              --format="json(version,tags,updateTime)" || echo "[]")

            # Emit "<index> <digest> <tags_csv>" sorted newest-first
            echo "$IMAGES_JSON" | jq -r '
              to_entries[] |
              "\(.key) \(.value.version) \((.value.tags // []) | join(","))"
            ' | while read -r IDX DIGEST TAGS; do
              if [ "$IDX" -lt "$KEEP_COUNT" ]; then
                echo "Keeping recent #${IDX}: ${DIGEST} (tags: ${TAGS:-none})"
                continue
              fi

              # Check if digest or any of its tags is in use by a live Cloud Run service
              IN_USE=false
              if echo "$LIVE_IMAGES" | grep -qF "$DIGEST"; then
                IN_USE=true
              fi
              if [ -n "$TAGS" ]; then
                IFS=',' read -ra TAG_ARR <<< "$TAGS"
                for T in "${TAG_ARR[@]}"; do
                  if echo "$LIVE_IMAGES" | grep -qF "${PKG}:${T}"; then
                    IN_USE=true
                  fi
                done
              fi

              if [ "$IN_USE" = "true" ]; then
                echo "Keeping live image: ${DIGEST} (tags: ${TAGS:-none})"
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "[dry-run] Would delete ${IMAGE_PREFIX}/${PKG}@${DIGEST} (tags: ${TAGS:-none})"
              else
                echo "Deleting ${IMAGE_PREFIX}/${PKG}@${DIGEST} (tags: ${TAGS:-none})..."
                gcloud artifacts docker images delete "${IMAGE_PREFIX}/${PKG}@${DIGEST}" \
                  --delete-tags \
                  --quiet || echo "Failed to delete ${DIGEST} (continuing)."
              fi
            done
          done
